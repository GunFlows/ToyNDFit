    # MC files
    filePathList:
      - "${TOYND_DATA}/T2KND_FHC_numu_C8H8_NEUT580_1M_0000_GUNDAMINPUT.root"
      - "${TOYND_DATA}/T2KND_RHC_numubar_C8H8_NEUT580_1M_0000_GUNDAMINPUT.root"


  data:
    - name: "dataToy"
      tree: "sample_sum"
      # Data files (same as MC here)
      filePathList:
        - "${TOYND_DATA}/T2KND_FHC_numu_C8H8_NEUT580_1M_0000_GUNDAMINPUT.root"
        - "${TOYND_DATA}/T2KND_RHC_numubar_C8H8_NEUT580_1M_0000_GUNDAMINPUT.root"