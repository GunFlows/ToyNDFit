# Flux Systematics:
# Each parameter represent a bin in true neutrino energy / flavor / FHC-RHC
- name: "Flux Systematics"
  isEnabled: true

  # Fit Parameters Options:
  allowPca: false # false by default
  useEigenDecompInFit: true
  #  maxEigenFraction: 0.99 # DON'T USE IT

  # Allow fit parameters to be thrown before fit (default: true)
  # Parameters Definition
  covarianceMatrixFilePath: "./inputs/parameters/flux/21bv2_run1to10_ndto9_banff.root"
  covarianceMatrixTMatrixD: "total_flux_cov"
  eigenParBounds:
    minValue: -30
    maxValue: 30
  useOnlyOneParameterPerEvent: true
  #atLeastOneDialPerEvent: true
  dialSetDefinitions:
    - applyOnDataSets: ["*"]
      propagateResponseOn: [ "weight" ]
      parametersBinningPath: "./inputs/parameters/flux/fluxBinning.txt"
      printDialsSummary: true
  printDialSetsSummary: true

# Detector systematics
# Parameters are defined by the covariance matrix
# Each bin of the matrix represent a kinematic bin
# Eigen decompose must be done
- name: "ND280 Detector Systematics"
  isEnabled: true

  useEigenDecompInFit: true
  allowPca: true
  #  maxEigenFraction: 0.99
  # Allow fit parameters to be thrown before fit (default: true)

  #covarianceMatrixFilePath: "./inputs/parameters/detector/obsNorm_covariance_2021_v7.root.decomp.root"
  covarianceMatrixFilePath: "./inputs/parameters/detector/obsNorm_covariance_2021_v7.root"
  #covarianceMatrixTMatrixD: Covariance_Matrix
  #parameterPriorTVectorD: Prior_Weights
  covarianceMatrixTMatrixD: obsNorm_cov
  parameterPriorTVectorD: obsNorm_weights
  useOnlyOneParameterPerEvent: true # since the cov matrix correspond to kinematic bins
  eigenParBounds:
    minValue: -30
    maxValue: 30
  dialSetDefinitions:
    - applyOnDataSets: [ "ND280" ]
      propagateResponseOn: [ "weight" ]
      #parametersBinningPath: "./inputs/parameters/detector/obsNorm_covariance_2021_v7_decomp.root.txt" #detector_covariance_2021_v7_all.root
      # This file stores the kinematic bins, for each sample, corresponding to the covariance matrix rows/columns (552 rows for AO2021)
      # need to define samples and binnings in order to define a cov matrix for this
      parametersBinningPath: "./inputs/parameters/detector/detector_covariance_2021_v7_all.root.txt"
      printDialsSummary: false
      maxDialResponse: 10
  printDialSetsSummary: false
  disableOneSigmaPlots: true
  skipVariedEventRates: true

# Cross-Section systematics
- name: "Cross-Section Systematics (FSI parameters)"
  isEnabled: true

  allowPca: false
  useEigenDecompInFit: true
  allowEigenDecompWithBounds: true  # Ignore bound set in cross-section file.
  eigenParBounds:
    minValue: -30
    maxValue:  30

#  covarianceMatrixFilePath: "./inputs/parameters/xsec/xsec_covariance_banff_2021a_v13_noFlux_050122_Mirror2p2hShape_MirrorRESEb_splineRS.root"
  covarianceMatrixFilePath: "./inputs/parameters/xsec/xsec_covariance_banff_2021a_v13_noFlux_PBOP0.root"

  covarianceMatrixTMatrixD: xsec_cov
  parameterNameTObjArray: xsec_param_names
  parameterPriorTVectorD: xsec_param_prior
  parameterLowerBoundsTVectorD: xsec_param_lb
  parameterUpperBoundsTVectorD: xsec_param_ub
  printDialSetsSummary: true

  # pre enabling
  enableOnlyParameters: [
    { name: "FEFQE" },
    { name: "FEFQEH" },
    { name: "FEFINEL" },
    { name: "FEFABS" },
    { name: "FEFCX" },
    { name: "FEFCXH" },
    { name: "Nucleon_FSI" }
  ]

  # Toy throwing properties
  throwEnabledList: "xsec_param_throw"

  parameterDefinitions:

    - name: "FEFQE"
      isEnabled: true
      dialSetDefinitions:
        - dialsType: Spline
          applyOnDataSets: [ "ND280" ]
          dialLeafName: "PionFSI_QELowMomProbGraph"
          minDialResponse: 0
          maxDialResponse: 100
          allowDialExtrapolation: true

    - name: "FEFQEH"
      isEnabled: true
      dialSetDefinitions:
        - dialsType: Spline
          applyOnDataSets: [ "ND280" ]
          dialLeafName: "PionFSI_QEHighMomProbGraph"
          minDialResponse: 0
          maxDialResponse: 100
          allowDialExtrapolation: true

    - name: "FEFINEL"
      isEnabled: true
      dialSetDefinitions:
        - dialsType: Spline
          applyOnDataSets: [ "ND280" ]
          dialLeafName: "PionFSI_InelProbGraph"
          minDialResponse: 0
          maxDialResponse: 100
          allowDialExtrapolation: true

    - name: "FEFABS"
      isEnabled: true
      dialSetDefinitions:
        - dialsType: Spline
          applyOnDataSets: [ "ND280" ]
          dialLeafName: "PionFSI_AbsProbGraph"
          minDialResponse: 0
          maxDialResponse: 100
          allowDialExtrapolation: true

    - name: "FEFCX"
      isEnabled: true
      dialSetDefinitions:
        - dialsType: Spline
          applyOnDataSets: [ "ND280" ]
          dialLeafName: "PionFSI_CExLowMomProbGraph"
          minDialResponse: 0
          maxDialResponse: 100
          allowDialExtrapolation: true

    - name: "FEFCXH"
      isEnabled: true
      dialSetDefinitions:
        - dialsType: Spline
          applyOnDataSets: [ "ND280" ]
          dialLeafName: "PionFSI_CExHighMomProbGraph"
          minDialResponse: 0
          maxDialResponse: 100
          allowDialExtrapolation: true

    - name: "Nucleon_FSI"
      isEnabled: true
      dialSetDefinitions:
        - dialsType: Spline
          applyOnDataSets: [ "ND280" ]
          dialLeafName: "Nucleon_Fate_FSIGraph"
          minDialResponse: 0
          maxDialResponse: 100
          allowDialExtrapolation: true

# Cross-Section systematics
- name: "Cross-Section Systematics"
  isEnabled: true

  allowPca: false

#  covarianceMatrixFilePath: "./inputs/parameters/xsec/xsec_covariance_banff_2021a_v13_noFlux_050122_Mirror2p2hShape_MirrorRESEb_splineRS.root"
