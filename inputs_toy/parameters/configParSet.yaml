  # pre disabling
  disableParameters: [
    { name: "FEFQE" },
    { name: "FEFQEH" },
    { name: "FEFINEL" },
    { name: "FEFABS" },
    { name: "FEFCX" },
    { name: "FEFCXH" },
    { name: "Nucleon_FSI" }
  ]

  parameterDefinitions:

    - name: "MAQE"
      isEnabled: true
      dialSetDefinitions:
