          maxDialResponse: 100
          allowDialExtrapolation: true

    - name: "Q2_norm_5"
      isEnabled: true
      dialSetDefinitions:
        - dialsType: Normalization
          nominal: 1
          applyCondition: "TMath::Abs([ReactionCode]) == 1 && (0.25 <= [Q2] && [Q2] < 0.5) && ( [TgtMat] == 12 || [TgtMat] == 16 ) && ( TMath::Abs([NeutrinoCode]) == 14 || TMath::Abs([NeutrinoCode]) == 12 )"
