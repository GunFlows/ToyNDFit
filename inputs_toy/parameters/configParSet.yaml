        - dialsType: Normalization
          nominal: 1
          applyCondition: "(TMath::Abs([ReactionCode]) == 35 || TMath::Abs([ReactionCode]) == 42 || TMath::Abs([ReactionCode]) == 43 || TMath::Abs([ReactionCode]) == 44 || TMath::Abs([ReactionCode]) == 45 || TMath::Abs([ReactionCode]) == 51 || TMath::Abs([ReactionCode]) == 52 || TMath::Abs([ReactionCode]) == 41 || TMath::Abs([ReactionCode]) == 46) && ( TMath::Abs([NeutrinoCode]) == 16 || TMath::Abs([NeutrinoCode]) == 14 || TMath::Abs([NeutrinoCode]) == 12 )  && [Enu] >= 0.0 && [Enu] < 30.0" # && [TgtMat] == -1
          #minDialResponse: 0
          #maxDialResponse: 100
          #allowDialExtrapolation: true

    - name: "NC_other_far"
      isEnabled: false
      dialSetDefinitions:
        - dialsType: Normalization
          nominal: 1
          applyCondition: "(TMath::Abs([ReactionCode]) == 0) && ( TMath::Abs([NeutrinoCode]) == 16 || TMath::Abs([NeutrinoCode]) == 14 || TMath::Abs([NeutrinoCode]) == 12 ) && [Enu] >= 0.0 && [Enu] < 30.0" #&& [TgtMat] == -1
