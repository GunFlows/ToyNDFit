          minDialResponse: 0
          maxDialResponse: 100
          allowDialExtrapolation: true

    - name: "CC_DIS_MultPi_Norm_Nu"
      isEnabled: true
      dialSetDefinitions:
        - dialsType: Normalization
          nominal: 1
          applyCondition: "([ReactionCode] == 21 || [ReactionCode] == 26) && ( [NeutrinoCode] == 14 || [NeutrinoCode] == 12 || [NeutrinoCode] == 16 ) && ( [TgtMat] == 12 || [TgtMat] == 16 ) && [Enu] >= 0.0 && [Enu] < 30.0"
          #minDialResponse: 0
          #maxDialResponse: 100

    - name: "CC_DIS_MultPi_Norm_Nubar"
      isEnabled: true
      dialSetDefinitions:
        - dialsType: Normalization
          nominal: 1
          applyCondition: "([ReactionCode] == -21 || [ReactionCode] == -26) && ( [NeutrinoCode] == -14 || [NeutrinoCode] == -12 || [NeutrinoCode] == -16 ) && ( [TgtMat] == 12 || [TgtMat] == 16 ) && [Enu] >= 0.0 && [Enu] < 30.0"
          #minDialResponse: 0
          #maxDialResponse: 100

    - name: "CC_Misc"
      isEnabled: true
      dialSetDefinitions:
        - dialsType: Normalization
          nominal: 1
          applyCondition: "( TMath::Abs([ReactionCode]) == 15 || TMath::Abs([ReactionCode]) == 17 || TMath::Abs([ReactionCode]) == 22 || TMath::Abs([ReactionCode]) == 23)  && ( [TgtMat] == 12 || [TgtMat] == 16 ) && ( TMath::Abs([NeutrinoCode]) == 14 || TMath::Abs([NeutrinoCode]) == 12 ) && [Enu] >= 0.0 && [Enu] < 30.0"
          #minDialResponse: 0
          #maxDialResponse: 100

    - name: "NC_Coh"
      isEnabled: false
      dialSetDefinitions:
        - dialsType: Normalization
          nominal: 1
          applyCondition: "TMath::Abs([ReactionCode]) == 36 && ( TMath::Abs([NeutrinoCode]) == 16 || TMath::Abs([NeutrinoCode]) == 14 || TMath::Abs([NeutrinoCode]) == 12 ) && [Enu] >= 0.0 && [Enu] < 30.0" #&& [TgtMat] == -1 
          #minDialResponse: 0
          #maxDialResponse: 100

    - name: "NC_1gamma"
      isEnabled: false
      dialSetDefinitions:
        - dialsType: Normalization
          nominal: 1
          applyCondition: "(TMath::Abs([ReactionCode]) == 38 || TMath::Abs([ReactionCode]) == 39) && ( TMath::Abs([NeutrinoCode]) == 16 || TMath::Abs([NeutrinoCode]) == 14 || TMath::Abs([NeutrinoCode]) == 12 ) && [Enu] >= 0.0 && [Enu] < 30.0" # && [TgtMat] == -1
          minDialResponse: 0
          maxDialResponse: 100

    - name: "NC_other_near"
