      dialSetDefinitions:
        - dialsType: Normalization
          nominal: 1
          applyCondition: "TMath::Abs([ReactionCode]) == 1 && (0.5 <= [Q2] && [Q2] < 1) && ( [TgtMat] == 12 || [TgtMat] == 16 ) && ( TMath::Abs([NeutrinoCode]) == 14 || TMath::Abs([NeutrinoCode]) == 12 )"
          #minDialResponse: 0
          #maxDialResponse: 100

    - name: "Q2_norm_7"
      isEnabled: true
      dialSetDefinitions:
        - dialsType: Normalization
          nominal: 1
          applyCondition: "TMath::Abs([ReactionCode]) == 1 && (1 <= [Q2] && [Q2] < 10) && ( [TgtMat] == 12 || [TgtMat] == 16 ) && ( TMath::Abs([NeutrinoCode]) == 14 || TMath::Abs([NeutrinoCode]) == 12 )"
