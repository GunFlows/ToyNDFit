# Stress-test dials (type: stress), computed by src/stress_dials.py from each event's true kinematics in the NUISANCE flat tree:
# constructed responses, no publication, that give the likelihood a parameter on its bound, a non-Gaussian enhancement, a kink, a
# moving threshold and two islands. Each dial acts on its `modes` (NEUT codes, negative for antineutrinos); weights at `knots`,
# relative to the sample as generated; `prior`/`sigma`/bounds define the prior; `truth` is the dial's value in the pseudo-data (the
# data tree's `weight` branch). `dial_type: Graph` = linear interpolation between knots. Knots as the prototype's evenly spaced grids
# (numpy.linspace) gave them, to the last bit, so that the events are unchanged.
# The full list is the prototype's set (GuNFlows variants/proto, nl76); phys61 and phys71 leave out MA_QE, Norm_CCcoh and Norm_DIS
# (superseded by their physics dials). `normalisations`: applied by GUNDAM through `apply_condition`, no per-event graph.
splines:
- {name: PB_like, type: stress, response: pb_like, modes: [1, -1], knots: [0.0, 0.25, 0.5, 0.75, 1.0], prior: 0.0, sigma: 0.5, lower_bound: 0.0, upper_bound: 1.0, truth: 0.0, reference: "constructed stress-test dial, no publication: Pauli-blocking-like low-q3 suppression of CCQE, w = 1 - x (1 - q3/0.3)^2 below q3 = 0.3 GeV; truth on the lower bound"}
- {name: A2p2h_gauss, type: stress, response: a2p2h_gauss, modes: [1, 2, -1, -2], knots: [0.0, 0.5, 1.0, 1.5, 2.0], prior: 0.0, sigma: 0.5, lower_bound: 0.0, upper_bound: 999.0, truth: 0.15, reference: "constructed stress-test dial, no publication: MINERvA-like Gaussian enhancement of CCQE and 2p2h in (q0, q3), w = 1 + x G, centre (0.25, 0.50) GeV, widths (0.06, 0.13) GeV"}
- {name: MA_QE, type: stress, response: ma_qe_dipole, modes: [1, -1], knots: [0.63, 0.73, 0.83, 0.9299999999999999, 1.03, 1.13, 1.23, 1.33, 1.43, 1.5299999999999998, 1.63], prior: 1.03, sigma: 0.10, lower_bound: 0.63, upper_bound: 1.63, truth: 1.10, reference: "constructed stress-test dial, no publication: dipole axial mass of CCQE, w = [(1 + Q2/1.03^2) / (1 + Q2/x^2)]^4, nominal 1.03 GeV (prototype only)"}
- {name: CC1pi_kink, type: stress, response: cc1pi_kink, modes: [11, 12, 13, -11, -12, -13], dial_type: Graph, knots: [0.4, 0.5, 0.6000000000000001, 0.7000000000000001, 0.8, 0.9000000000000001, 1.0, 1.1, 1.2000000000000002, 1.3000000000000003, 1.4000000000000004, 1.5000000000000004, 1.6], prior: 1.0, sigma: 0.15, lower_bound: 0.4, upper_bound: 1.6, truth: 1.0, reference: "constructed stress-test dial, no publication: resonant single pion, kink at the nominal 1, w = 1 + t (x - 1) times 0.6 above and 0.2 below, t = Enu mapped onto [-1, 1] over 0.3-3 GeV"}
- {name: RES_lowQ2_thr, type: stress, response: res_lowq2_thr, modes: [11, 12, 13, -11, -12, -13], knots: [0.0, 0.1, 0.2, 0.30000000000000004, 0.4, 0.5, 0.6000000000000001, 0.7000000000000001, 0.8, 0.9, 1.0, 1.1, 1.2000000000000002, 1.3, 1.4000000000000001, 1.5, 1.6, 1.7000000000000002, 1.8, 1.9000000000000001, 2.0, 2.1, 2.2, 2.3000000000000003, 2.4000000000000004, 2.5], prior: 1.0, sigma: 0.3, lower_bound: 0.0, upper_bound: 2.5, truth: 1.0, reference: "constructed stress-test dial, no publication: resonant single pion, 50 % suppression below the threshold Q2_c = 0.1 x GeV^2 (logistic edge, width 0.01 GeV^2), relative to the nominal threshold x = 1"}
- {name: DIS_even, type: stress, response: dis_even, modes: [21, 22, 23, 24, 26, -21, -22, -23, -24, -26], knots: [-2.5, -2.0, -1.5, -1.0, -0.5, 0.0, 0.5, 1.0, 1.5, 2.0, 2.5], prior: 0.0, sigma: 1.0, lower_bound: -2.5, upper_bound: 2.5, truth: 0.8, reference: "constructed stress-test dial, no publication: multi-pion and DIS, even response w = 1 + 0.15 t x^2 (+x and -x identical: two islands), t = Enu mapped onto [-1, 1] over 0.5-5 GeV"}
normalisations:
- {name: Norm_CCcoh, type: stress, response: norm, modes: [16, -16], apply_condition: "[Reaction] == 16 || [Reaction] == -16", prior: 1.0, sigma: 0.3, lower_bound: 0.0, upper_bound: 999.0, truth: 1.0, reference: "constructed stress-test dial, no publication: CC coherent normalisation (prototype only)"}
- {name: Norm_DIS, type: stress, response: norm, modes: [21, 22, 23, 24, 26, -21, -22, -23, -24, -26], apply_condition: "([Reaction] >= 21 && [Reaction] <= 26) || ([Reaction] <= -21 && [Reaction] >= -26)", prior: 1.0, sigma: 0.2, lower_bound: 0.0, upper_bound: 999.0, truth: 1.0, reference: "constructed stress-test dial, no publication: multi-pion and DIS normalisation (prototype only)"}
