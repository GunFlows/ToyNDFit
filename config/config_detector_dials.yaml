# Detector-response dials (type: detector), computed by src/detector_dials.py from each event's true and smeared muon kinematics:
# exact reweighting of this toy's Gaussian smearing (ND280 resolution maps, reso_maps/). Knots and bounds in the dial's own units
# (momentum in MeV/c), bounds at 3 prior widths (further out, single weights of events in the far Gaussian tails exceed 100). Every dial is 1 (or 0) at nominal: the pseudo-data are smeared with the nominal maps.
# Public sources only: [P15] T2K arXiv:1502.01550 Sec. IV.B.4 (ND280 detector systematics); [P14] T2K arXiv:1403.2552 Sec. VI.A.1;
# [P18] T2K arXiv:1801.05148 Sec. III.D, Table III; [W] C. Wret, T2K-THESIS-097 (2016), Eqs. 5.9-5.15; [GS] A. Garcia Soto, PhD thesis
# UAB (2017), Sec. 9.3.1.
splines:
- {name: DET_mom_scale, type: detector, response: mom_scale, knots: [-0.018, -0.012, -0.006, -0.003, 0, 0.003, 0.006, 0.012, 0.018], prior: 0.0, sigma: 0.006, lower_bound: -0.018, upper_bound: 0.018, reference: "momentum scale from the magnetic field strength, 0.6 % [P15][P14]; p' = p (1 + a ds) [W] Eq. 5.15"}
- {name: DET_mom_bias_vertex, type: detector, response: mom_shift, knots: [-21, -14, -7, -3.5, 0, 3.5, 7, 14, 21], prior: 0.0, sigma: 7.0, lower_bound: -21, upper_bound: 21, reference: "momentum bias from vertex migration, 7 MeV/c on the reconstructed momentum [P18]"}
- {name: DET_mom_resol_p0_300, type: detector, response: mom_resol, p_range: [0, 300], cos_range: [0.7, 1.01], knots: [0.7, 0.8, 0.9, 0.95, 1, 1.05, 1.1, 1.2, 1.3], prior: 1.0, sigma: 0.1, lower_bound: 0.7, upper_bound: 1.3, reference: "TPC momentum resolution scale; (reco - true) scaled [W] Eq. 5.9; data/MC (30 +- 10) % [P14], per-bin error 0.1 [GS]"}
- {name: DET_mom_resol_p300_400, type: detector, response: mom_resol, p_range: [300, 400], cos_range: [0.7, 1.01], knots: [0.7, 0.8, 0.9, 0.95, 1, 1.05, 1.1, 1.2, 1.3], prior: 1.0, sigma: 0.1, lower_bound: 0.7, upper_bound: 1.3, reference: "as DET_mom_resol_p0_300"}
- {name: DET_mom_resol_p400_800, type: detector, response: mom_resol, p_range: [400, 800], cos_range: [0.7, 1.01], knots: [0.7, 0.8, 0.9, 0.95, 1, 1.05, 1.1, 1.2, 1.3], prior: 1.0, sigma: 0.1, lower_bound: 0.7, upper_bound: 1.3, reference: "as DET_mom_resol_p0_300"}
- {name: DET_mom_resol_p800_1500, type: detector, response: mom_resol, p_range: [800, 1500], cos_range: [0.7, 1.01], knots: [0.7, 0.8, 0.9, 0.95, 1, 1.05, 1.1, 1.2, 1.3], prior: 1.0, sigma: 0.1, lower_bound: 0.7, upper_bound: 1.3, reference: "as DET_mom_resol_p0_300"}
- {name: DET_mom_resol_p1500_5000, type: detector, response: mom_resol, p_range: [1500, 5000], cos_range: [0.7, 1.01], knots: [0.7, 0.8, 0.9, 0.95, 1, 1.05, 1.1, 1.2, 1.3], prior: 1.0, sigma: 0.1, lower_bound: 0.7, upper_bound: 1.3, reference: "as DET_mom_resol_p0_300; above 1.4 GeV/c the published (30 +- 10) % [P14]"}
- {name: DET_mom_resol_p5000_up, type: detector, response: mom_resol, p_range: [5000, 1.0e+9], cos_range: [0.7, 1.01], knots: [0.7, 0.8, 0.9, 0.95, 1, 1.05, 1.1, 1.2, 1.3], prior: 1.0, sigma: 0.1, lower_bound: 0.7, upper_bound: 1.3, reference: "as DET_mom_resol_p1500_5000"}
- {name: DET_mom_resol_high_angle, type: detector, response: mom_resol, p_range: [0, 1.0e+9], cos_range: [-1.01, 0.7], knots: [0.7, 0.8, 0.9, 0.95, 1, 1.05, 1.1, 1.2, 1.3], prior: 1.0, sigma: 0.1, lower_bound: 0.7, upper_bound: 1.3, reference: "high-angle tracks (cos < 0.7, 45-60 deg here): momentum-by-range resolution ~10 % in the barrel ECal [P18]"}
- {name: DET_angle_resol, type: detector, response: angle_resol, knots: [0.7, 0.8, 0.9, 0.95, 1, 1.05, 1.1, 1.2, 1.3], prior: 1.0, sigma: 0.1, lower_bound: 0.7, upper_bound: 1.3, reference: "muon angle resolution scale; no public ND280 number: 10 % chosen as for the momentum resolution"}
