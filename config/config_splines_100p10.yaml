

# Define the spline systematics to save in the dataset here. This is also used to generate the covariance matrix



# # instantiate spline generators (DEPRECATED)
# Spline_Enu = SplineGenerator(spline_type="polynomial", power=3, range_width=-0.3, kin_min=0.0, kin_max=5) # enhance events with low neutrino energy
# Spline_PP = SplineGenerator(spline_type="polynomial", power=3, range_width=0.3, kin_min=0, kin_max=1) # enhance/reduce pion production events as a function of pion energy
# Spline_FSIstrength = SplineGenerator(spline_type="polynomial", power=3, range_width=0.3, kin_min=-0.2, kin_max=0.2) # reweight FSI strength
# Spline_mirror_q0 = SplineGenerator(spline_type="mirrored", power=1, range_width=0.1, kin_min=0, kin_max=0.5, min_fixer = 0) # reweight events based on  q0
# Spline_mirror_q3 = SplineGenerator(spline_type="mirrored", power=3, range_width=0.1, kin_min=0, kin_max=0.5, min_fixer=1) # reweight events based on  q3
# Spline_bound_W = SplineGenerator(spline_type="polynomial", power=1, range_width=0.1, kin_min=0, kin_max=1.5) # reweight events based on  W



generate_cov_matrix: true
cov_file_path: "${NDFITMOCKUP_GUNDAM_WS}/inputs/parameters/splines/spl10_with_names.root"
filter_sigma: 0.5
blobs: 2
seed: 42

splines:
  - name: "Spline_Enu"
    prior: 1.0
    sigma: 0.1
    type: "polynomial"
    power: 3
    graph_points: 5
    kin_variable: "Enu_true"  # This has to be an attribute of the NUISANCEEvent class
    kin_min: 0.0
    kin_max: 5.0
    importance: 0.3 # how much does the weight vary as a function of the dial ?
    range_min: 0.7  # dial lower bound to build the TGraph (outside this, the dial is EXTRAPOLATED)
    range_max: 1.3  # dial upper bound to build the TGraph (outside this, the dial is EXTRAPOLATED)
    lower_bound: -999.0 # dial limit for Gundam fit
    upper_bound: 999.0 # dial limit for Gundam fit

  - name: "Spline_PP"
    prior: 1.0
    sigma: 0.1
    type: "polynomial"
    power: 3
    graph_points: 5
    kin_variable: "total_pion_energy"
    kin_min: 0.0
    kin_max: 1.0
    importance: 0.3
    range_min: 0.7
    range_max: 1.3
    lower_bound: -999.0 # dial limit for Gundam fit
    upper_bound: 999.0 # dial limit for Gundam fit

  - name: "Spline_FSIstrength"
    prior: 1.0
    sigma: 0.1
    type: "polynomial"
    power: 3
    graph_points: 5
    kin_variable: "FSI_strength"
    kin_min: -0.2
    kin_max: 0.2
    importance: 0.3
    range_min: 0.7
    range_max: 1.3
    lower_bound: -999.0 # dial limit for Gundam fit
    upper_bound: 999.0 # dial limit for Gundam fit

  - name: "Spline_mirror_q0"
    prior: 1.0
    sigma: 0.1
    type: "mirrored"
    power: 1
    graph_points: 20
    kin_variable: "q0"
    kin_min: 0.0
    kin_max: 0.5
    importance: 0.1
    range_min: 0.7
    range_max: 1.3
    lower_bound: -999.0 # dial limit for Gundam fit
    upper_bound: 999.0 # dial limit for Gundam fit
    mirror_point: 1.05  # needed for mirror splines

  - name: "Spline_mirror_q3"
    prior: 1.0
    sigma: 0.1
    type: "mirrored"
    power: 3
    graph_points: 20
    kin_variable: "q3"
    kin_min: 0.0
    kin_max: 0.5
    importance: 0.3
    range_min: 0.7
    range_max: 1.3
    lower_bound: -999.0 # dial limit for Gundam fit
    upper_bound: 999.0 # dial limit for Gundam fit
    mirror_point: 0.9  # needed for mirror splines

  - name: "Spline_bound_W"
    prior: 1.0
    sigma: 0.1
    type: "polynomial"
    power: 1
    graph_points: 5
    kin_variable: "W"
    kin_min: 0.0
    kin_max: 1.5
    importance: 0.3
    range_min: 0.7
    range_max: 1.3
    lower_bound: -999.0 # dial limit for Gundam fit
    upper_bound: 999.0 # dial limit for Gundam fit

  - name: "Spline_Emiss"
    prior: 1.0
    sigma: 0.1
    type: "polynomial"
    power: 1
    graph_points: 5
    kin_variable: "Emiss"
    kin_min: 0.0
    kin_max: 0.15
    importance: 0.3
    range_min: 0.7
    range_max: 1.3
    lower_bound: -999.0 # dial limit for Gundam fit
    upper_bound: 999.0 # dial limit for Gundam fit

  - name: "Spline_pmiss"
    prior: 1.0
    sigma: 0.1
    type: "polynomial"
    power: 1
    graph_points: 5
    kin_variable: "magnitude_pmiss"
    kin_min: 0.0
    kin_max: 600
    importance: 0.3
    range_min: 0.7
    range_max: 1.3
    lower_bound: -999.0 # dial limit for Gundam fit
    upper_bound: 999.0 # dial limit for Gundam fit

  - name: "Spline_Q2"
    prior: 1.0
    sigma: 0.1
    type: "polynomial"
    power: 1
    graph_points: 10
    kin_variable: "Q2"
    kin_min: 0.0
    kin_max: 0.25
    importance: 0.3
    range_min: 0.7
    range_max: 1.3
    lower_bound: -999.0 # dial limit for Gundam fit
    upper_bound: 999.0 # dial limit for Gundam fit

  - name: "Spline_PB_nuantinu"
    prior: 1.0
    sigma: 0.1
    type: "polynomial"
    power: 1
    graph_points: 10
    kin_variable: "PNucleon_nuantinu"
    kin_min: -2.0
    kin_max: 2.0
    importance: 0.4
    range_min: 0.7
    range_max: 1.3
    lower_bound: -999.0 # dial limit for Gundam fit
    upper_bound: 999.0 # dial limit for Gundam fit
