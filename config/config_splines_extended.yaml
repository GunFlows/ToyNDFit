# ToyNDFit dev/extendedLLH: his 10 dials (config_splines_100p10.yaml) plus 58 mode-restricted dials imitating the T2K ND interaction model.
# Extra keys, read by dial_value() in src/produce_dataset_from_NUISANCE.py:
#   modes: NEUT codes the dial acts on (negative = antineutrino); other events, or events where `source` is undefined (< -900), get no dial (w = 1).
#   source: the NUISANCEEvent variable the dial's response depends on (kin_variable dial_<name> only names the graphs).
#   prior_type: flat = no prior (sigma then only sets the starting step). Normalisations: kin range below every value, so w = x.
generate_cov_matrix: true
cov_file_path: ${NDFITMOCKUP_GUNDAM_WS}/inputs/parameters/splines/spl68_extended.root
filter_sigma: 0.0
blobs: 2
seed: 42
scale_correlation: 0.1
splines:
- name: Spline_Enu
  prior: 1.0
  sigma: 0.1
  type: polynomial
  power: 3
  graph_points: 5
  kin_variable: Enu_true
  kin_min: 0.0
  kin_max: 5.0
  importance: 0.1
  range_min: 0.7
  range_max: 1.3
  lower_bound: -999.0
  upper_bound: 999.0
- name: Spline_PP
